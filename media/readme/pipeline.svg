<svg xmlns="http://www.w3.org/2000/svg" width="960" height="236" viewBox="0 0 960 236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <!-- README hero: inputs, the in-memory hop through Ipynb PDF Converter, and the pdf-lib steps. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8c96a8"/>
    </marker>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6bb42"/>
      <stop offset="1" stop-color="#e08a1e"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="235" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- input 1: .pdf -->
  <g transform="translate(44 30)">
    <path d="M0 0 h30 l12 12 v46 a4 4 0 0 1 -4 4 h-38 a4 4 0 0 1 -4 -4 v-54 a4 4 0 0 1 4 -4 z" fill="#ffffff" stroke="#9aa6c2"/>
    <path d="M30 0 v12 h12 z" fill="#f3e0b8"/>
    <rect x="6" y="20" width="24" height="3.5" rx="1.75" fill="#c7cdd8"/>
    <rect x="6" y="28" width="30" height="3.5" rx="1.75" fill="#c7cdd8"/>
    <rect x="9" y="40" width="28" height="14" rx="4" fill="#e5322d"/>
    <text x="23" y="50" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">PDF</text>
  </g>
  <text x="65" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#e5322d">.pdf</text>

  <!-- input 2: .ipynb / .md -->
  <g transform="translate(36 126)">
    <path d="M18 0 h30 l12 12 v46 a4 4 0 0 1 -4 4 h-38 a4 4 0 0 1 -4 -4 v-54 a4 4 0 0 1 4 -4 z" fill="#ffffff" stroke="#c7cdd8"/>
    <path d="M48 0 v12 h12 z" fill="#e3e7ef"/>
    <path d="M0 10 h30 l12 12 v46 a4 4 0 0 1 -4 4 h-38 a4 4 0 0 1 -4 -4 v-54 a4 4 0 0 1 4 -4 z" fill="#ffffff" stroke="#9aa6c2"/>
    <path d="M30 10 v12 h12 z" fill="#d9e0f5"/>
    <rect x="6" y="30" width="18" height="3.5" rx="1.75" fill="#2b2b2f"/>
    <rect x="6" y="38" width="30" height="14" rx="3" fill="#1d222a"/>
    <rect x="10" y="43" width="8" height="2.5" rx="1.25" fill="#c678dd"/>
    <rect x="20" y="43" width="12" height="2.5" rx="1.25" fill="#c0c6d3"/>
    <rect x="10" y="48" width="18" height="2.5" rx="1.25" fill="#98c379"/>
    <rect x="6" y="58" width="30" height="3.5" rx="1.75" fill="#c7cdd8"/>
  </g>
  <text x="65" y="214" text-anchor="middle" font-size="12" font-weight="700" fill="#3f54b5">.ipynb · .md</text>

  <!-- converter hop -->
  <line x1="100" y1="160" x2="134" y2="160" stroke="#8c96a8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="136" y="124" width="156" height="72" rx="12" fill="#eef1fb" stroke="#9aa6c2"/>
  <text x="214" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#3f54b5">Ipynb PDF Converter</text>
  <text x="214" y="168" text-anchor="middle" font-size="11.5" fill="#57606a">API로 메모리에서 PDF 변환</text>
  <text x="214" y="184" text-anchor="middle" font-size="11.5" fill="#57606a">임시 파일 없음 · 0.10 이상</text>

  <!-- merge into step 1 -->
  <g fill="none" stroke="#8c96a8" stroke-width="1.5">
    <path d="M94 62 H296 Q306 62 306 72 V104"/>
    <path d="M292 160 H296 Q306 160 306 150 V104"/>
    <path d="M306 104 H314" marker-end="url(#arrow)"/>
  </g>

  <!-- steps -->
  <g font-size="12" fill="#57606a">
    <rect x="316" y="48" width="160" height="112" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
    <circle cx="338" cy="68" r="11" fill="url(#amber)"/>
    <text x="338" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
    <text x="330" y="100" font-size="14" font-weight="700" fill="#24292f">원본 PDF 열기</text>
    <text x="330" y="122">pdf-lib (@cantoo/pdf-lib)</text>
    <text x="330" y="140">비밀번호 걸린 PDF도 처리</text>

    <line x1="478" y1="104" x2="498" y2="104" stroke="#8c96a8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="500" y="48" width="160" height="112" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
    <circle cx="522" cy="68" r="11" fill="url(#amber)"/>
    <text x="522" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
    <text x="514" y="100" font-size="14" font-weight="700" fill="#24292f">페이지 재구성</text>
    <text x="514" y="122">원본 임베드 · 줄노트</text>
    <text x="514" y="140">머릿말 · 꼬릿말 · 분리선</text>

    <line x1="662" y1="104" x2="682" y2="104" stroke="#8c96a8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="684" y="48" width="160" height="112" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
    <circle cx="706" cy="68" r="11" fill="url(#amber)"/>
    <text x="706" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
    <text x="698" y="100" font-size="14" font-weight="700" fill="#24292f">저장</text>
    <text x="698" y="122">AES-256 암호화 (선택)</text>
    <text x="698" y="140">같은 이름이면 (1), (2)…</text>
  </g>
  <line x1="846" y1="104" x2="866" y2="104" stroke="#8c96a8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- output -->
  <g transform="translate(872 62)">
    <path d="M0 0 h34 l14 14 v60 a4 4 0 0 1 -4 4 h-44 a4 4 0 0 1 -4 -4 v-70 a4 4 0 0 1 4 -4 z" fill="#ffffff" stroke="#9aa6c2"/>
    <path d="M34 0 v14 h14 z" fill="#f3e0b8"/>
    <rect x="6" y="14" width="36" height="24" fill="#ffffff" stroke="#cfcfcf" stroke-width="0.8"/>
    <rect x="10" y="19" width="16" height="3" rx="1.5" fill="#24292f"/>
    <rect x="10" y="26" width="26" height="2.5" rx="1.25" fill="#c7cdd8"/>
    <rect x="10" y="31" width="20" height="2.5" rx="1.25" fill="#c7cdd8"/>
    <g stroke="#b9b9b9" stroke-width="1" stroke-dasharray="2.5 2.5" stroke-linecap="round">
      <line x1="6" y1="48" x2="42" y2="48"/>
      <line x1="6" y1="56" x2="42" y2="56"/>
      <line x1="6" y1="64" x2="42" y2="64"/>
      <line x1="6" y1="72" x2="30" y2="72"/>
    </g>
  </g>
  <text x="896" y="156" text-anchor="middle" font-size="12" font-weight="700" fill="#e08a1e">이름_note.pdf</text>

  <text x="480" y="220" text-anchor="middle" font-size="13" fill="#57606a">원본 파일은 건드리지 않음 · 한글 파일명은 내장 NanumGothic으로 · 진행률 알림에서 취소 가능</text>
</svg>
