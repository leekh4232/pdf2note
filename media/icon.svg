<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Extension icon: a page whose top holds the original document and whose
       lower part is a ruled note area with a pencil. Source for media/icon.png. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6bb42"/>
      <stop offset="1" stop-color="#e08a1e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="52" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <path d="M70 36 h86 l36 36 v148 a8 8 0 0 1 -8 8 h-114 a8 8 0 0 1 -8 -8 v-176 a8 8 0 0 1 8 -8 z" fill="#ffffff"/>
    <path d="M156 36 v28 a8 8 0 0 0 8 8 h28 z" fill="#f3e0b8"/>
  </g>
  <!-- original document, framed -->
  <rect x="80" y="60" width="94" height="50" rx="4" fill="#ffffff" stroke="#c9c9c9" stroke-width="2"/>
  <rect x="88" y="70" width="46" height="7" rx="3.5" fill="#2b2b2f"/>
  <rect x="88" y="84" width="70" height="5" rx="2.5" fill="#c7cdd8"/>
  <rect x="88" y="95" width="56" height="5" rx="2.5" fill="#c7cdd8"/>
  <!-- ruled note lines -->
  <g stroke="#b9b9b9" stroke-width="2.5" stroke-dasharray="5 5" stroke-linecap="round">
    <line x1="80" y1="130" x2="180" y2="130"/>
    <line x1="80" y1="148" x2="180" y2="148"/>
    <line x1="80" y1="166" x2="180" y2="166"/>
    <line x1="80" y1="184" x2="180" y2="184"/>
    <line x1="80" y1="202" x2="150" y2="202"/>
  </g>
  <!-- pencil -->
  <g transform="translate(206 160) rotate(45)" filter="url(#shadow)">
    <rect x="-11" y="-56" width="22" height="78" rx="4" fill="#3f54b5"/>
    <rect x="-11" y="-56" width="22" height="14" rx="4" fill="#ff8a80"/>
    <path d="M-11 22 L0 48 L11 22 z" fill="#f3e0b8"/>
    <path d="M-4 38 L0 48 L4 38 z" fill="#2b2b2f"/>
  </g>
</svg>
